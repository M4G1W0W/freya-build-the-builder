[project]
name = "freya-builder"
version = "0.0.0"
description = "YC 'Build the Builder' hackathon: a builder that turns a bank's collections brief into a Freya voice agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pip>=26.2.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["kit"]  # official kit, kept unmodified

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # `ruff format` keeps code at 100 cols; prompt strings may be longer
