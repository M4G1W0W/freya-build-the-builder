<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing Command Center</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#5d6470;--line:#e2e5ea;--ok:#127a3a;--okbg:#e5f4ea;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6;--acc:#2f5bd3;--code:#f0f2f5}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1a1d24;--ink:#e7e9ee;--mute:#9aa1ad;--line:#2b3039;--ok:#5fd08a;--okbg:#14301f;--bad:#ff7b72;--badbg:#3a1714;--warn:#f2c14e;--warnbg:#352a0d;--acc:#7aa2ff;--code:#22262e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:15px;margin:0}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}.meta{color:var(--mute);font-size:12px}
main{padding:14px 16px;max-width:1500px;margin:0 auto}section{display:none}section.on{display:block}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}.big{font-size:26px;font-weight:650}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line);white-space:nowrap}.ok{color:var(--ok);background:var(--okbg);border-color:transparent}.bad{color:var(--bad);background:var(--badbg);border-color:transparent}.warn{color:var(--warn);background:var(--warnbg);border-color:transparent}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:12px}th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
tr.click{cursor:pointer}tr.click:hover{background:var(--code)}tr.sel{outline:2px solid var(--acc)}.wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
code,pre{background:var(--code);border-radius:4px;font:11.5px/1.4 ui-monospace,Menlo,monospace}code{padding:0 3px}pre{padding:8px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;margin:4px 0}
h2{font-size:14px;margin:18px 0 8px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mute{color:var(--mute)}.sm{font-size:11px}
details summary{cursor:pointer;color:var(--acc)}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px}@media(max-width:900px){.split{grid-template-columns:1fr}}
select{font:inherit;padding:4px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;max-width:100%}
.bar{height:10px;background:var(--acc);border-radius:3px}.r{text-align:right}
.msg{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;background:var(--card)}.msg.you{border-left:4px solid var(--acc)}.msg.claude{border-left:4px solid var(--ok)}.msg pre{max-height:none;background:transparent;padding:0;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.evt{color:var(--mute);font-size:11px;margin:2px 0 2px 10px}
.cited{outline:2px solid var(--warn);background:var(--warnbg)}.kv td:first-child{color:var(--mute);white-space:nowrap;width:1%}.box{border:1px dashed var(--line);border-radius:6px;padding:6px 8px;margin:6px 0}
.sw button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:4px 9px;border-radius:6px;cursor:pointer;font:inherit}.sw button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.note{color:var(--warn);background:var(--warnbg);border-radius:4px;padding:2px 6px;margin-top:4px;overflow-wrap:anywhere}
.cmpm th,.cmpm td{white-space:nowrap}.cmpm .rh{position:sticky;left:0;z-index:2;background:var(--card);white-space:normal;min-width:230px;max-width:300px}.cmpm th.rh{z-index:4}.cmpm th{z-index:3}.cmpm tr.grp td{background:var(--code);font-weight:650}.cmpm tr.fam td{color:var(--mute)}.cmpm .ent{margin:1px 0}a.evl{margin-left:4px;font-size:11px;color:var(--acc);text-decoration:none}.cmpm .note{margin-top:1px;padding:0 4px;white-space:normal;max-width:220px}
</style>
</head>
<body>
<header>
  <div><h1>Freya Builder · Testing Command Center</h1><div class="meta">Read-only · strict scoring from <code>all_rows</code> · <span id="fresh">loading…</span></div></div>
  <nav id="nav"></nav>
</header>
<main>
<section id="overview"></section><section id="history"></section><section id="cases"></section><section id="evidence"></section>
<section id="compare"></section><section id="rules"></section><section id="failures"></section><section id="builder"></section><section id="claude"></section><section id="system"></section>
</main>
<script>
const TABS=[["overview","Overview"],["history","Test History"],["cases","Case Explorer"],["evidence","Failure Evidence"],["compare","Config Comparison"],["rules","Rules & Cases"],["failures","Failure Analysis"],["builder","Builder Generalization"],["claude","Claude Session"],["system","System Status"]];
let S={},tab=location.hash.slice(1)||"overview",selRun=null,selCase=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NA='<span class="mute">Not available</span>';
const pill=(t,k)=>`<span class="pill ${k||""}">${esc(t)}</span>`;
const rep=v=>v===true?pill("pass","ok"):v===false?pill("fail","bad"):pill("—");
const ago=s=>s==null?"?":s<90?s+" s":s<5400?Math.round(s/60)+" min":(s/3600).toFixed(1)+" h";
const short=x=>x?esc(String(x).slice(0,8)):NA;
const csrc=s=>!s?pill("unknown","bad"):s.startsWith("build trace")?pill("trace","ok"):s.startsWith("deploy-log")?pill("deploy log name","warn"):pill(s.split(" (")[0],"bad");
function nav(){document.getElementById("nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(k){tab=k;location.hash=k;nav();render()}
async function load(){
  try{
    const [o,r,f,b,s,c,cv,cs]=await Promise.all(["overview","runs","failures","builder","snapshot","claude-activity","claude-conversation","claude-sessions"].map(p=>fetch("/api/"+p).then(x=>{if(!x.ok)throw new Error("server warming up or unavailable ("+x.status+"); retrying in 12 s");return x.json()})));
    const first=!S.o;S={o,r,f,b,s,c,cv,cs};document.getElementById("fresh").textContent="data refreshed "+o.refreshed+" · page polls every 12 s";
    if(first||!["evidence","compare","rules"].includes(tab))render();  // evidence and comparison: no re-render while reading
  }catch(e){document.getElementById("fresh").textContent="refresh failed: "+e}
}
function render(){for(const [k] of TABS)document.getElementById(k).classList.toggle("on",k===tab);if(!S.o)return;({overview,history,cases,evidence,compare,rules,failures,builder,claude,system})[tab]()}

function scoreBlock(p){
  const l=p.latest;if(!l)return `<div class="big mute">—</div><div>${NA}: no complete 3-rep full-set run</div>`;
  const tr=p.trend==="improvement"?pill("▲ improvement","ok"):p.trend==="regression"?pill("▼ regression","bad"):p.trend?pill("= unchanged"):"";
  return `<div class="row"><span class="big">${esc(l.strict)}</span>${tr}${p.stale===null?pill("tested commit unknown","bad"):p.stale?pill("stale: code changed since","warn"):pill("current","ok")}</div>
  <div class="sm">per rep: ${l.per_rep_passed.map(esc).join(" · ")} (of ${l.total}) · ${l.reps} reps</div>
  <div class="sm">previous: <b>${esc(p.previous?.strict||"—")}</b> · best: <b>${esc(p.best?.strict||"—")}</b> at <code>${short(p.best?.commit)}</code> ${p.best?csrc(p.best.commit_source):""} · ${esc(p.best?.slot||"")}</div>
  <div class="sm">tested commit <code>${short(l.commit)}</code> ${csrc(l.commit_source)} · ${esc(l.build_mode)}</div>
  <div class="sm">agent ${esc(l.slot||"?")} v${esc(l.version??"?")} · <code>${short(l.agent_id)}</code> · wf <code>${short(l.workflow_id)}</code></div>
  <div class="sm">style: ${esc(l.style)} · ended ${esc(l.end)}</div>
  ${p.notes.map(n=>`<div class="sm note">${esc(n)}</div>`).join("")}`;
}
function overview(){
  const o=S.o.overview,ws=o.working_state||{};
  const run=o.running.length?o.running.map(p=>`${pill("RUNNING","warn")} ${esc(p.kind)} (${esc(p.elapsed)})<div class="sm mute">${esc(p.what)}</div>`).join(""):pill("nothing running","ok")+`<div class="sm mute">${esc(o.running_note)}</div>`;
  const lc=o.latest_completed;
  document.getElementById("overview").innerHTML=`
  <div class="grid">
   <div class="card"><h3>Git HEAD</h3><div class="big"><code>${esc(o.head)}</code></div>${o.tree==="clean"?pill("tree clean","ok"):pill("tree dirty","warn")} ${o.builder_code_dirty?pill("builder code dirty","bad"):pill("builder code clean","ok")}
     <div class="sm mute">${o.tracked_changes.length} tracked change(s), ${o.untracked.length} untracked</div></div>
   <div class="card"><h3>Latest measured commit</h3><div class="big"><code>${short(o.latest_measured_commit)}</code></div><div class="sm">${esc(o.latest_measured_commit_subject||"")}</div><div class="sm">${csrc(o.latest_measured_commit_source)}</div></div>
   <div class="card"><h3>Running now (process-verified)</h3>${run}</div>
   <div class="card"><h3>Latest completed test</h3>${lc?`<div><b>${esc(lc.strict)}</b> ${lc.official_style?"strict":pill("not an official-style 3/3 run","warn")} · ${esc(lc.reps)} reps · <code>${short(lc.commit)}</code></div><div class="sm">${esc(lc.run)}</div><div class="sm">${esc(o.latest_completed_panel)}</div><div class="sm">${ago(o.seconds_since_last_result)} ago (${esc(lc.end)})</div>`:NA}</div>
   <div class="card"><h3>Claude engineering session</h3>${S.c&&S.c.available?`<div><b>${esc(S.c.current_task.session_title)}</b></div><div class="sm">${esc(S.c.state)}</div><div class="sm mute">last write ${esc(S.c.transcript_last_write)} · ${S.c.errors.length} recent error(s)</div><a class="sm" href="#claude">details</a>`:`<div class="mute">${esc(S.c?.reason||"Not available")}</div>`}</div>
   <div class="card"><h3>Code commits not yet measured</h3><div class="big ${o.untested_code_commits.length?"":"mute"}">${o.untested_code_commits.length}</div><div class="sm mute">src/ or builder/ commits after the latest measured commit</div></div>
  </div>
  <h2>Official-style performance (strict: a case passes only if every rep passes)</h2>
  <div class="grid">${S.o.panels.map(p=>`<div class="card"><h3>${esc(p.panel)}</h3>${scoreBlock(p)}<div class="sm mute">${p.official_runs} official-style run(s)${p.latest_non_official?` · latest non-official: ${esc(p.latest_non_official.strict)} (${esc(p.latest_non_official.reps)} rep, ${esc(p.latest_non_official.style)})`:""}</div></div>`).join("")}</div>
  <div class="split"><div>
   <h2>Fixes committed but not yet measured</h2>
   ${o.untested_code_commits.length?`<table><tr><th>Commit</th><th>Time (UTC)</th><th>Subject</th></tr>${o.untested_code_commits.map(c=>`<tr><td><code>${esc(c.commit)}</code></td><td>${esc(c.time)}</td><td>${esc(c.subject)}</td></tr>`).join("")}</table>`:'<div class="mute">none</div>'}
   <h2>Integrity flags (${o.integrity_flags.length})</h2>
   <div class="wrap" style="max-height:260px"><table>${o.integrity_flags.map(f=>`<tr><td class="sm">${esc(f.run)}</td><td>${esc(f.flag)}</td></tr>`).join("")||"<tr><td>none</td></tr>"}</table></div>
  </div><div>
   <h2>Blockers and open problems <span class="pill warn">human-written: ${esc(ws.file)} · snapshot ${esc(ws.snapshot)}</span></h2>
   <pre>${esc(ws.open_problems||"Not available")}</pre>
   <h2>User actions pending</h2>${(ws.user_actions||[]).map(u=>`<div class="sm">• ${esc(u)}</div>`).join("")||NA}
   <h2>WORKING_STATE "Running right now" (may be stale; trust the process check above)</h2><pre>${esc(ws.running_section||"Not available")}</pre>
  </div></div>`;
}
function chart(p){
  const h=p.history;if(!h.length)return NA;const W=420,H=110,pad=24;
  const xs=i=>pad+(h.length===1?0:i*(W-2*pad)/(h.length-1)),ys=v=>H-pad-v*(H-2*pad);
  const pts=h.map((d,i)=>`${xs(i)},${ys(d.rate)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px"><line x1="${pad}" x2="${W-pad}" y1="${ys(1)}" y2="${ys(1)}" stroke="var(--line)"/><line x1="${pad}" x2="${W-pad}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--line)"/>
  <text x="2" y="${ys(1)+4}" font-size="9" fill="var(--mute)">100%</text><text x="6" y="${ys(0)+4}" font-size="9" fill="var(--mute)">0%</text>
  <polyline fill="none" stroke="var(--acc)" stroke-width="1.5" points="${pts}"/>${h.map((d,i)=>`<circle cx="${xs(i)}" cy="${ys(d.rate)}" r="3.5" fill="${d.fixture_spec?"var(--card)":d.rate===1?"var(--ok)":"var(--acc)"}" stroke="var(--acc)"><title>${esc(d.strict+" · "+(d.commit||"?")+" · "+d.style+" · "+(d.slot||"?")+" · "+d.build_mode+(d.fixture_spec?" · FIXTURE spec (not builder output; excluded from best/trend)":"")+" · "+d.end)}</title></circle><text x="${xs(i)}" y="${H-6}" font-size="8" text-anchor="middle" fill="var(--mute)">${esc((d.commit||"?").slice(0,7))}</text>`).join("")}</svg>`;
}
function history(){
  const runs=[...S.r.runs].reverse();
  document.getElementById("history").innerHTML=`
  <div class="grid">${S.o.panels.map(p=>`<div class="card"><h3>${esc(p.panel)} · official-style runs</h3>${chart(p)}<div class="sm mute">hollow point = hand-written fixture spec (excluded from best/trend); hover a point for agent and build mode</div></div>`).join("")}</div>
  <h2>All result files (${runs.length}); official-style = complete, all cases, 3+ reps</h2>
  <div class="wrap"><table><tr><th>Ended (UTC)</th><th>Run file</th><th>Panel</th><th>Style</th><th>Reps</th><th>Strict</th><th>Per rep</th><th>Tested commit</th><th>Source</th><th>Build mode</th><th>Agent</th><th>Flags</th></tr>
  ${runs.map(r=>`<tr class="click" onclick="pick('${esc(r.id)}')"><td>${esc(r.end)}</td><td class="sm">${esc(r.id)}</td><td class="sm">${esc(r.panel)}</td><td class="sm">${esc(r.style)}</td><td>${r.reps}</td>
  <td>${r.official_style?`<b>${r.strict_passed}/${r.total}</b>`:`${r.strict_passed}/${r.total} ${pill(r.complete?(r.subset?"subset":r.reps+"-rep"):"incomplete","warn")}`}</td><td class="sm">${r.per_rep_passed.join(" · ")}</td>
  <td><code>${short(r.commit)}</code></td><td>${csrc(r.commit_source)}</td><td class="sm">${esc(r.build_mode)}</td><td class="sm">${esc(r.slot||"?")} v${esc(r.version??"?")}</td>
  <td>${r.flags.length?`<span title="${esc(r.flags.join("\n"))}">${pill(r.flags.length+" flag(s)","warn")}</span>`:""}</td></tr>`).join("")}</table></div>
  <h2>Runs that never produced a result (${S.r.incomplete.length})</h2>
  <div class="wrap" style="max-height:300px"><table><tr><th>Time (UTC)</th><th>Log</th><th>Label</th><th>Status</th><th>Last line</th></tr>${S.r.incomplete.map(i=>`<tr><td>${esc(i.time)}</td><td class="sm">${esc(i.file)}</td><td><code>${esc(i.label||"")}</code></td><td>${pill(i.status,"bad")}</td><td class="sm">${esc(i.reason)}</td></tr>`).join("")}</table></div>`;
}
function pick(id){selRun=id;selCase=null;go("cases")}
async function cases(){
  const runs=[...S.r.runs].reverse();if(!selRun)selRun=(runs.find(r=>r.official_style)||runs[0]||{}).id;
  const r=S.r.runs.find(x=>x.id===selRun);if(!r){document.getElementById("cases").innerHTML=NA;return}
  const el=document.getElementById("cases");
  el.innerHTML=`<div class="row"><b>Run</b><select onchange="selRun=this.value;selCase=null;render()">${runs.map(x=>`<option value="${esc(x.id)}" ${x.id===selRun?"selected":""}>${esc(x.end.slice(5,16))} · ${esc(x.panel)} · ${x.strict_passed}/${x.total} · ${esc(x.style)} · ${esc((x.commit||"?").slice(0,7))} · ${esc(x.name)}</option>`).join("")}</select></div>
  <div class="sm" style="margin:6px 0">commit <code>${short(r.commit)}</code> ${csrc(r.commit_source)} · ${esc(r.build_mode)} · agent ${esc(r.slot||"?")} v${esc(r.version??"?")} · deploy ${esc(r.deploy_log||"Not available")} · ${r.flags.map(f=>pill(f,"warn")).join(" ")}</div>
  <div class="split"><div class="wrap"><table><tr><th>Case</th><th>Set</th><th>Style</th>${Array.from({length:r.reps},(_,i)=>`<th>Rep ${i+1}</th>`).join("")}<th>Strict</th><th>Category (auto)</th><th>Commit</th><th>Agent v</th></tr>
  ${r.cases.map(c=>`<tr class="click ${c.id===selCase?"sel":""}" onclick="selCase='${esc(c.id)}';showCase()"><td><b>${esc(c.id)}</b><div class="sm mute">${esc(c.family)}</div></td><td>${esc(r.case_set)}</td><td class="sm">${esc(c.style)}</td>${c.reps.map(rep).join("")}<td>${c.strict?pill("PASS","ok"):pill("FAIL","bad")}</td><td class="sm">${esc(c.category||"")}</td><td><code>${short(r.commit)}</code></td><td>${esc(r.version??"?")}</td></tr>`).join("")}</table></div>
  <div id="detail" class="card">Select a case.</div></div>`;
  if(selCase)showCase();
}
async function showCase(){
  document.querySelectorAll("#cases tr.click").forEach(t=>t.classList.toggle("sel",t.textContent.startsWith(selCase)));
  const d=document.getElementById("detail");d.innerHTML="loading…";
  const res=await fetch(`/api/case?run=${encodeURIComponent(selRun)}&case=${encodeURIComponent(selCase)}`);
  if(!res.ok){d.innerHTML=NA;return}const x=await res.json();
  d.innerHTML=`<h3>${esc(x.case.id)} · ${esc(x.case.family)} · ${esc(x.case.style)} · ${x.case.strict?pill("strict PASS","ok"):pill("strict FAIL","bad")}</h3>
  <div class="sm">Recurring: failed (not 3/3) in ${x.recurring.failed_runs} of ${x.recurring.runs_with_case} runs of this case set ${x.recurring.failed_runs>1?pill("recurring","bad"):""}</div>
  <details><summary>History of this case</summary><table>${x.recurring.history.map(h=>`<tr><td class="sm">${esc(h.end)}</td><td class="sm">${esc(h.run)}</td><td><code>${short(h.commit)}</code></td><td>${h.reps.map(rep).join(" ")}</td><td>${h.official_style?"official":"non-official"}</td></tr>`).join("")}</table></details>
  <h2>Expected ledger <span class="sm mute">(${esc(x.expected_source)})</span></h2>${x.expected?`<pre>${esc(JSON.stringify(x.expected,null,1))}</pre>`:NA}
  ${x.script?`<details><summary>Customer script and judge checks</summary><pre>${esc(x.script)}\n\n- ${esc((x.checks||[]).join("\n- "))}</pre></details>`:""}
  ${x.reps.map(rp=>`<h2>Rep ${rp.rep}: ${rp.pass===true?pill("pass","ok"):rp.pass===false?pill("fail","bad"):NA}</h2>
   <div class="sm">tools: ${rp.tools?esc(rp.tools.join(" > ")):NA} · ended: ${esc(rp.ended??"?")} · slowest turn ${esc(rp.slowest_turn_s??"?")} s · call <code>${short(rp.call_id)}</code></div>
   ${rp.detail?`<div class="sm">category (auto): <b>${esc(rp.detail.category)}</b> · tags: ${esc(rp.detail.tags.join(", "))}</div>
    ${rp.detail.ledger.length?`<table><tr><th>Ledger field</th><th>Actual</th><th>Expected</th></tr>${rp.detail.ledger.map(l=>`<tr><td>${esc(l.field)}</td><td class="bad">${esc(l.actual)}</td><td>${esc(l.expected)}</td></tr>`).join("")}</table>`:'<div class="sm">Ledger: no mismatch reported</div>'}
    ${rp.detail.judge.map(j=>`<div class="sm"><b>Judge</b> <span class="mute">(as stored by run_cases.py, cut at 400 chars by the kit)</span>: ${esc(j)}</div>`).join("")}${rp.detail.other.map(j=>`<div class="sm">${esc(j)}</div>`).join("")}`:""}
   <div class="sm"><a href="#evidence" data-rep="${rp.rep}" onclick="evSel={run:selRun,case:selCase,rep:+this.dataset.rep};evData=null">open the full evidence for rep ${rp.rep} →</a></div>
   <details><summary>Transcript ${rp.transcript?`(${esc(rp.transcript_source)})`:"— Not available locally"}</summary>${rp.transcript?`<pre>${esc(rp.transcript)}</pre>`:NA}</details>`).join("")}
  <h2>Human notes (Score log rows citing this run)</h2>${x.human_notes.length?x.human_notes.map(n=>`<pre>${esc(n)}</pre>`).join(""):NA}
  <h2>Artifacts</h2>${x.artifacts.filter(Boolean).map(a=>`<div class="sm"><code>${esc(a)}</code></div>`).join("")}`;
}
let evIdx=null,evSel=null,evData=null,evGroup="completed_official";
const V=x=>x==null?NA:typeof x==="string"?(x.startsWith("Not available")?`<span class="mute">${esc(x)}</span>`:esc(x)):`<pre>${esc(JSON.stringify(x,null,1))}</pre>`;

function failures(){
  const f=S.f,max=Math.max(1,...f.categories_official_runs.map(c=>c[1]));
  const T=(rows,cols)=>rows.length?`<table><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join("")}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td class="sm">${esc(typeof c[1]==="function"?c[1](r):r[c[1]])}</td>`).join("")}</tr>`).join("")}</table>`:'<div class="mute">none</div>';
  document.getElementById("failures").innerHTML=`<div class="sm mute">${esc(f.classifier)}</div>
  <div class="split"><div><h2>Failed reps by category (official-style runs)</h2><table>${f.categories_official_runs.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v}</td><td style="width:50%"><div class="bar" style="width:${100*v/max}%"></div></td></tr>`).join("")}</table>

}

  <h2>Conflicts and stale information</h2>${x.conflicts_and_stale.map(c=>`<div class="card" style="margin:6px 0"><h3>${esc(c.kind)} · ${esc(c.topic)}</h3><div class="sm">${esc(c.explanation)}</div>${(c.sides||[]).map(s=>`<div class="box sm">${lbl((x.sources.find(m=>m.file===s.source_file)||{}).label||"unregistered")} ${src(s)} ${stat(s.status)}<div>“${esc(s.quote)}”</div></div>`).join("")}${c.differences?(c.differences.length?`<details><summary class="sm">${c.differences.length} difference(s)</summary><table><tr><th>Case</th><th>Field</th><th>Kit</th><th>Page snapshot</th></tr>${c.differences.map(d=>`<tr><td>${esc(d.case)}</td><td class="sm">${esc(d.field)}</td><td class="sm"><pre>${esc(JSON.stringify(d.kit,null,1))}</pre></td><td class="sm"><pre>${esc(JSON.stringify(d.page,null,1))}</pre></td></tr>`).join("")}</table></details>`:'<div class="sm ok">no differences</div>'):""}</div>`).join("")}
  <h2>Internal decisions ${pill("team-written, NOT organizer rules","warn")}</h2>
  ${[["internal_budget","Budgets"],["internal_freeze","Freeze targets"],["internal_promotion","Promotion criteria"],["internal_other","Other internal decisions"]].map(([c,t])=>`<h3 style="margin:10px 0 4px">${esc(t)}</h3>${rcItems(cat(x.internal_decisions,c),true)}`).join("")}
  <h2>Unresolved interpretations</h2>${rcItems(x.interpretations,true)}
  <h2>Organizer clarifications</h2>${rcItems(x.clarifications,true)}
  <h2>Missing or not recorded</h2>${x.missing.length?`<ul class="sm">${x.missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:'<div class="sm mute">none</div>'}
  <h2>Briefs (${x.briefs.length})</h2><table><tr><th>File</th><th>Label</th><th>Sections</th><th>Last change</th></tr>${x.briefs.map(b=>`<tr><td class="sm"><code>${esc(b.file)}</code><details><summary class="sm">original text</summary><pre>${esc(b.text)}</pre></details></td><td>${lbl(b.label)}<div class="sm mute">${esc(b.kind||"")}</div></td><td class="sm">${b.sections.slice(0,12).map(s=>esc(s)).join("<br>")}${b.sections.length>12?"<br>…":""}</td><td class="sm">${esc(b.last_commit_date||b.modified||"")}${b.uncommitted_changes?" "+pill("uncommitted changes","warn"):""}</td></tr>`).join("")}</table>
  <h2>Case sets (${x.case_sets.length})</h2>${x.case_sets.map(s=>`<details class="card" style="margin:6px 0"${s.label==="official"?" open":""}><summary><b><code>${esc(s.file)}</code></b> ${lbl(s.label)} <span class="sm mute">${esc(s.kind||"")} · ${s.cases.length} case(s) · last change ${esc(s.last_commit_date||s.modified||"?")}</span></summary>
   ${(s.notes||[]).map(n=>`<div class="sm note">${esc(n.summary)} <span class="mute">${esc(n.notes||"")}</span></div>`).join("")}
   <table><tr><th>Case</th><th>Brief · family · level</th><th>Style</th><th>Expected</th><th>Checks</th></tr>${s.cases.map(c=>`<tr><td class="sm"><b>${esc(c.id)}</b><div>${esc(c.title||"")}</div>${c.script?`<details><summary class="sm">script</summary><pre>${esc(c.script)}</pre></details>`:""}</td><td class="sm">${esc(c.brief??"")} · ${esc(c.family??"")} · ${esc(c.level??"")}</td><td class="sm">${esc(c.style??"–")}</td><td class="sm"><pre>${esc(JSON.stringify(c.expected,null,1))}</pre></td><td class="sm">${(c.checks||[]).map(k=>`<div>• ${esc(k)}</div>`).join("")}</td></tr>`).join("")}</table></details>`).join("")}
  <h2>Sources (${x.sources.length})</h2><div class="wrap" style="max-height:420px"><table><tr><th>File</th><th>Label</th><th>Kind · link · captured</th><th>Last commit</th><th>Working tree</th></tr>${x.sources.map(s=>`<tr><td class="sm"><code>${esc(s.file)}</code></td><td>${lbl(s.label)}</td><td class="sm">${esc(s.kind||"")}${s.link?`<div><code>${esc(s.link)}</code></div>`:""}${s.captured?`<div class="mute">captured: ${esc(s.captured)}</div>`:""}${(s.notes||[]).filter(n=>n.category==="source_date").map(n=>`<div class="mute">stated: “${esc(n.quote)}”</div>`).join("")}</td><td class="sm">${s.exists?`${esc(s.last_commit_date||"never committed")} <code>${esc(s.last_commit||"")}</code><div class="mute">${esc(s.last_commit_subject||"")}</div>`:pill("missing","bad")}</td><td class="sm">${s.uncommitted_changes?pill("uncommitted changes","warn"):s.exists?"clean":""}${s.modified?`<div class="mute">modified ${esc(s.modified)}</div>`:""}</td></tr>`).join("")}</table></div>`;
}
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(k&&k!==tab&&TABS.some(t=>t[0]===k)){tab=k;nav();render()}});
nav();load();setInterval(load,12000);
</script>
</body>
</html>
