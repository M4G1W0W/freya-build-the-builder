# Our mock bank for the final (template). Deploy: `npx wrangler deploy` from mock/ after `npx wrangler login`.
# Set the admin token once: `npx wrangler secret put ADMIN_TOKEN` (used only for /v1/ledger and /v1/reset).
name = "teampistalogic"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "CUSTOMER_STATE"
class_name = "CustomerState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CustomerState"]

[[durable_objects.bindings]]
name = "REQUEST_LOG"
class_name = "RequestLog"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RequestLog"]
